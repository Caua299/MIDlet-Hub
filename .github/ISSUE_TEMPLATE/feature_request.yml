name: Sugestão / Feature request
description: Ideia de melhoria ou função nova / Idea for an improvement or new feature
title: "[Sugestão] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pela ideia! Pode escrever em português ou em inglês.

        Thanks for the idea! You can write in Portuguese or English.
  - type: textarea
    id: idea
    attributes:
      label: O que você gostaria que o app fizesse? / What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Por que isso ajudaria? / Why would this help?
      description: "Conte a situação em que você sentiu falta disso. / Describe the situation where you missed it."
