name: Build APK (debug)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Aplicar zip de modernização (se existir)
        run: |
          ZIP=J2ME-Loader-modernizado.zip
          if [ -f "$ZIP" ]; then
            mkdir -p /tmp/novo
            unzip -q "$ZIP" -d /tmp/novo
            SRC=$(find /tmp/novo -mindepth 1 -maxdepth 1 -type d | head -n1)
            EXCL=(--exclude="/.git" --exclude="/.github" --exclude="/$ZIP")
            if [ -f .gitmodules ]; then
              for p in $(git config --file .gitmodules --get-regexp path | awk '{print $2}'); do
                EXCL+=(--exclude="/$p")
              done
            fi
            rsync -a --delete "${EXCL[@]}" "$SRC"/ ./
            rm -f "$ZIP"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Aplica modernização (Material 3, remoção do AppCenter, CI)" || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/dev/debug/*.apk dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: dist/*.apk

      - name: Recreate tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="repos/$GITHUB_REPOSITORY/git"
          gh api -X DELETE "$base/refs/tags/latest-debug" >/dev/null 2>&1 || true
          gh api -X POST "$base/refs" -f ref="refs/tags/latest-debug" -f sha="$GITHUB_SHA" >/dev/null

      - name: Publish release with APK
        uses: ncipollo/release-action@v1
        with:
          tag: latest-debug
          commit: ${{ github.sha }}
          name: Latest debug build
          body: APK de teste gerado automaticamente a partir do último commit.
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: dist/*.apk
